<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="checkbox" id="theme">
  <label for="theme" class="switch">Switch Theme</label>

  <div class="card">
    <p class="title">Front-End Developer</p>
    <p class="bio">I build clean, responsive websites and love simple, useful design.</p>
  </div>
</body>
</html>
